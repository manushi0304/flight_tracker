name: Daily Fare Check

on:
  schedule:
    # 00:30 UTC = 06:00 IST, every day
    - cron: "30 0 * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

# Prevent overlapping runs if one takes longer than a day (shouldn't happen, but safe)
concurrency:
  group: daily-fare-check
  cancel-in-progress: false

jobs:
  run-daily-job:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to commit flights.db back to the repo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily fetch + alert job
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # leave this secret unset for $0 cost
          DB_PATH: flights.db
          PRICE_DROP_THRESHOLD_INR: "1000"
          TRACK_START_DATE: "2027-01-10"
          TRACK_END_DATE: "2027-02-20"
          ROUTES: "BOM:SYD,DEL:SYD,BLR:SYD"
          CURRENCY: "INR"
          REQUEST_DELAY_SECONDS: "3"
          MAX_RETRIES: "3"
        run: python daily_job.py

      - name: Persist updated price database back to the repo
        run: |
          git config user.name "flight-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add flights.db
          git diff --cached --quiet || git commit -m "Update flight price data [skip ci]"
          git push
