name: Weekly Digest

on:
  schedule:
    # 02:30 UTC on Mondays = 08:00 IST Monday
    - cron: "30 2 * * 1"
  workflow_dispatch: {}

concurrency:
  group: weekly-digest
  cancel-in-progress: false

jobs:
  run-weekly-job:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4   # pulls the flights.db committed by the daily workflow

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run weekly digest job
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # leave this secret unset for $0 cost
          DB_PATH: flights.db
          ROUTES: "BOM:SYD,DEL:SYD,BLR:SYD"
          TRACK_START_DATE: "2027-01-10"
          TRACK_END_DATE: "2027-02-20"
        run: python weekly_job.py
